name: GiftLink CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ─────────────────────────────────────────────────────────────
  backend:
    name: Backend – Install & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: giftlink-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: giftlink-backend
        run: npm install

      - name: Run backend tests
        working-directory: giftlink-backend
        run: npm test
        env:
          MONGO_URL: ${{ secrets.MONGO_URL || 'mongodb://localhost:27017' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret' }}

  # ── Sentiment Service ─────────────────────────────────────────────────────────
  sentiment:
    name: Sentiment – Install & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install sentiment dependencies
        working-directory: sentiment
        run: npm install

      - name: Verify sentiment entry file exists
        run: test -f sentiment/index.js

  # ── Frontend Build ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend – Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: giftlink-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: giftlink-frontend
        run: npm install

      - name: Build frontend
        working-directory: giftlink-frontend
        run: npm run build
        env:
          REACT_APP_BACKEND_URL: http://localhost:3060
          CI: false   # Prevents treating warnings as errors
